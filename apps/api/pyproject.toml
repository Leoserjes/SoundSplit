[project]
name = "soundsplit-api"
version = "0.2.0"
description = "FastAPI backend for SoundSplit harmonIA."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic-settings>=2.2.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "httpx2>=2.2.0",
  "pytest>=8.0.0"
]

[tool.ruff]
line-length = 100
