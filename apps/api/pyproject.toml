[project]
name = "soundsplit-api"
version = "0.3.0"
description = "FastAPI backend for SoundSplit harmonIA."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic-settings>=2.2.1",
  "python-multipart>=0.0.9",
  "soundsplit-knowledge[postgres]>=0.1.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.ruff]
line-length = 100
