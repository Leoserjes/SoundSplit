name: Windows Diagnostic Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/windows-diagnostic-build.yml"
      - "apps/api/**"
      - "apps/desktop/**"
      - "workers/ai/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "docs/distribution/**"

permissions:
  contents: read

concurrency:
  group: windows-diagnostic-build-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_API_ENVIRONMENT: development
  VITE_API_BASE_URL: http://127.0.0.1:8000

jobs:
  windows-diagnostic-build:
    name: Windows diagnostic build
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps\api[test]" -e "workers\ai[test]"

      - name: Run validation gates
        shell: pwsh
        run: |
          npm audit --audit-level=high
          npm run dev:check
          npm run desktop:test
          npm run desktop:build
          python -m pytest --rootdir=. apps\api\tests workers\ai\tests
          python -m compileall apps\api workers\ai
          Get-Content apps\desktop\src-tauri\tauri.conf.json | ConvertFrom-Json | Out-Null

      - name: Attempt native Tauri build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\diagnostics | Out-Null
          $logPath = "artifacts\diagnostics\tauri-build.log"
          npm --workspace apps/desktop run tauri -- build *>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect diagnostic manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\diagnostics | Out-Null
          node --version | Out-File artifacts\diagnostics\node-version.txt
          npm --version | Out-File artifacts\diagnostics\npm-version.txt
          python --version | Out-File artifacts\diagnostics\python-version.txt
          rustc --version | Out-File artifacts\diagnostics\rust-version.txt
          cargo --version | Out-File artifacts\diagnostics\cargo-version.txt
          Get-Content apps\desktop\src-tauri\tauri.conf.json | Out-File artifacts\diagnostics\tauri-conf.json.txt
          $bundleRoot = "apps\desktop\src-tauri\target\release\bundle"
          if (Test-Path $bundleRoot) {
            Get-ChildItem $bundleRoot -Recurse -File |
              Select-Object FullName, Length, LastWriteTime |
              ConvertTo-Json -Depth 3 |
              Out-File artifacts\diagnostics\bundle-files.json
          } else {
            "No Tauri bundle directory was produced." | Out-File artifacts\diagnostics\bundle-files.txt
          }

      - name: Upload internal installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harmonIA-windows-internal-installers
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmonIA-windows-diagnostic-logs
          retention-days: 7
          if-no-files-found: warn
          path: artifacts/diagnostics/**
