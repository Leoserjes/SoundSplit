services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: soundsplit
      POSTGRES_PASSWORD: soundsplit
      POSTGRES_DB: soundsplit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/knowledge/soundsplit_knowledge/schema.sql:/docker-entrypoint-initdb.d/10-knowledge.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: soundsplit
      MINIO_ROOT_PASSWORD: soundsplit-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

